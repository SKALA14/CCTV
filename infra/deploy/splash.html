<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>CCTV 시작 중</title>
<style>
  :root { color-scheme: light }
  html, body { height: 100%; margin: 0 }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
    background: #f5f6f8; color: #1f2937;
  }
  .spinner {
    width: 48px; height: 48px;
    border: 4px solid #d1d5db; border-top-color: #2563eb;
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg) } }
  h1 { font-size: 18px; font-weight: 600; margin: 24px 0 6px }
  p  { font-size: 13px; color: #6b7280; margin: 0 }
  .slow { margin-top: 16px; font-size: 12px; color: #9ca3af; visibility: hidden }
</style>
</head>
<body>
  <div class="spinner"></div>
  <h1>시스템을 시작하는 중…</h1>
  <p>서버가 준비되면 자동으로 관제 화면으로 전환됩니다.</p>
  <p class="slow" id="slow">예상보다 오래 걸리고 있습니다. 잠시만 더 기다려 주세요…</p>
<script>
  // file:// 페이지에서는 fetch가 막혀, 이미지 핑으로 준비 여부를 감지한다.
  var WALL = "http://localhost/wall";
  var PING = "http://localhost/ping.gif";
  var t0 = Date.now();
  function check() {
    var img = new Image();
    img.onload  = function () { location.href = WALL; };   // 프론트가 떠서 이미지를 줌 → 전환
    img.onerror = function () { retry(); };                 // 아직 안 뜸 → 재시도
    img.src = PING + "?t=" + Date.now();                    // 캐시 우회
  }
  function retry() {
    if (Date.now() - t0 > 60000) {
      document.getElementById("slow").style.visibility = "visible";
    }
    setTimeout(check, 1000);
  }
  check();
</script>
</body>
</html>
