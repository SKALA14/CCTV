services:
  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no
    ports:
      - "6379:6379"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cctv
      POSTGRES_PASSWORD: cctv
      POSTGRES_DB: cctv
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mediamtx:
    image: bluenviron/mediamtx
    ports:
      - "8554:8554"
      - "8888:8888"
      - "8889:8889"   # WebRTC
      - "9997:9997"   # 관리 API
    volumes:
      - ./mediamtx.yml:/mediamtx.yml

  ingestion_0:
    build:
      context: ../services/ingestion
    image: cctv-ingestion
    environment:
      CAMERA_ID: cam0
      SAMPLE_FPS: "2"
      FRAME_STORAGE_PATH: /frames/
      REDIS_URL: redis://redis:6379
    volumes:
      - ../frames:/frames
      - ../sample:/sample
    depends_on:
      - redis
    restart: always

  ingestion_1:
    build:
      context: ../services/ingestion
    image: cctv-ingestion
    environment:
      CAMERA_ID: cam1
      SAMPLE_FPS: "2"
      FRAME_STORAGE_PATH: /frames/
      REDIS_URL: redis://redis:6379
    volumes:
      - ../frames:/frames
    depends_on:
      - redis
    restart: always

  ingestion_2:
    build:
      context: ../services/ingestion
    image: cctv-ingestion
    environment:
      CAMERA_ID: cam2
      SAMPLE_FPS: "2"
      FRAME_STORAGE_PATH: /frames/
      REDIS_URL: redis://redis:6379
    volumes:
      - ../frames:/frames
    depends_on:
      - redis
    restart: always

  ingestion_3:
    build:
      context: ../services/ingestion
    image: cctv-ingestion
    environment:
      CAMERA_ID: cam3
      SAMPLE_FPS: "2"
      FRAME_STORAGE_PATH: /frames/
      REDIS_URL: redis://redis:6379
    volumes:
      - ../frames:/frames
    depends_on:
      - redis
    restart: always

  inference:
    build:
      context: ../services/inference
    environment:
      REDIS_URL: redis://redis:6379
      CAMERA_ID: ${CAMERA_ID:-video0}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      PROMPT_DIR: /service/prompts
      FRAME_STORAGE_PATH: /frames
      FRAMES_STREAM: frames
      EVENTS_STREAM: events
      ALERTS_STREAM: alerts
      DEVICE: cpu
    volumes:
      - ../frames:/frames
    depends_on:
      - redis

  backend:
    build:
      context: ../services/backend
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql+asyncpg://cctv:cctv@postgres:5432/cctv
      EVENTS_STREAM: events
      ALERTS_STREAM: alerts
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - redis
      - postgres

  notification:
    build:
      context: ../services/notification
    environment:
      REDIS_URL: redis://redis:6379
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      ALERTS_STREAM: alerts
      EVENTS_STREAM: events
    depends_on:
      - redis
    restart: always

  frontend:
    build:
      context: ../services/frontend
    ports:
      - "80:80"
    volumes:
      - ../sample:/sample
    depends_on:
      - backend
      - mediamtx

  loki:
    image: grafana/loki:2.9.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana_data:/var/lib/grafana
    depends_on:
      - loki

volumes:
  redis_data:
  postgres_data:
  loki_data:
  grafana_data: