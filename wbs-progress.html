<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>프로젝트 진척도</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
</style>
</head>
<body>
<svg viewBox="0 0 1600 820" width="1600" height="820" xmlns="http://www.w3.org/2000/svg">
<defs>
  <!-- Arrow gradient: deep red → orange → light yellow -->
  <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#991B1B"/>
    <stop offset="48%"  stop-color="#EA580C"/>
    <stop offset="100%" stop-color="#FDE68A"/>
  </linearGradient>

  <!-- Glow for current phase -->
  <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="8" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <!-- Drop shadow for cards -->
  <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#991B1B" flood-opacity="0.10"/>
  </filter>

  <!-- Arrowhead -->
  <marker id="arrowTip" markerWidth="14" markerHeight="10" refX="13" refY="5" orient="auto">
    <polygon points="0 0, 14 5, 0 10" fill="#FDE68A"/>
  </marker>

  <style>
    /* 완료: 짙은 빨강 */
    .done-node   { fill: #991B1B; }
    .done-title  { fill: #991B1B; font-weight: 700; }
    .done-task   { fill: #3B1717; }
    .badge-done  { fill: #FEE2E2; }
    .badge-done-text { fill: #991B1B; font-size: 11px; font-weight: 600; }

    /* 진행중: 주황 */
    .active-node  { fill: #EA580C; }
    .active-title { fill: #C2410C; font-weight: 700; }
    .active-task  { fill: #9A3412; }
    .badge-active { fill: #FFEDD5; }
    .badge-active-text { fill: #EA580C; font-size: 11px; font-weight: 700; }

    /* 진행 예정: 연노랑 */
    .todo-node  { fill: #FFFBEB; stroke: #FCD34D; stroke-width: 2.5; stroke-dasharray: 6 4; }
    .todo-title { fill: #B45309; font-weight: 600; }
    .todo-task  { fill: #B45309; }
    .badge-todo { fill: #FEF9C3; }
    .badge-todo-text { fill: #B45309; font-size: 11px; font-weight: 500; }
  </style>
</defs>

<!-- ─── Background ─── -->
<rect width="1600" height="820" fill="white"/>

<!-- ─── Header ─── -->
<text x="800" y="58" text-anchor="middle" font-size="26" font-weight="700" fill="#0F172A" letter-spacing="-0.3">프로젝트 진척도</text>
<text x="800" y="82" text-anchor="middle" font-size="14" fill="#64748B">CCTV 이상 탐지 및 의미 기반 검색 시스템 · 2026.04 – 06</text>

<!-- ─── Main Arrow ─── -->
<line x1="58" y1="390" x2="1555" y2="390"
      stroke="url(#arrowGrad)" stroke-width="6" stroke-linecap="round"
      marker-end="url(#arrowTip)"/>


<!-- ════════════════════════════════════════════════════
     PHASE 1  x=130  완료
════════════════════════════════════════════════════ -->
<g>
  <line x1="130" y1="270" x2="130" y2="362" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.35"/>
  <line x1="130" y1="418" x2="130" y2="490" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.35"/>

  <rect x="60" y="210" width="140" height="58" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="60" y="210" width="140" height="58" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="130" y="233" text-anchor="middle" font-size="11" fill="#FCA5A5" font-weight="600" letter-spacing="1">PHASE 1</text>
  <text x="130" y="256" text-anchor="middle" font-size="14" font-weight="700" class="done-title">킥오프</text>

  <rect x="96" y="268" width="68" height="20" rx="10" class="badge-done"/>
  <text x="130" y="282" text-anchor="middle" class="badge-done-text">✓ 완료</text>

  <circle cx="130" cy="390" r="26" class="done-node" filter="url(#shadow)"/>
  <text x="130" y="395" text-anchor="middle" font-size="15" fill="white" font-weight="700">P1</text>

  <text x="130" y="508" text-anchor="middle" font-size="12" class="done-task">개발 표준 정리</text>
  <text x="130" y="526" text-anchor="middle" font-size="12" class="done-task">API 계약 초안</text>
  <text x="130" y="544" text-anchor="middle" font-size="11" fill="#D1D5DB">W1 – W2</text>
</g>


<!-- ════════════════════════════════════════════════════
     PHASE 2  x=340  완료
════════════════════════════════════════════════════ -->
<g>
  <line x1="340" y1="270" x2="340" y2="362" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.35"/>
  <line x1="340" y1="418" x2="340" y2="490" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.35"/>

  <rect x="270" y="210" width="140" height="58" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="270" y="210" width="140" height="58" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="340" y="233" text-anchor="middle" font-size="11" fill="#FCA5A5" font-weight="600" letter-spacing="1">PHASE 2</text>
  <text x="340" y="256" text-anchor="middle" font-size="14" font-weight="700" class="done-title">설계</text>

  <rect x="306" y="268" width="68" height="20" rx="10" class="badge-done"/>
  <text x="340" y="282" text-anchor="middle" class="badge-done-text">✓ 완료</text>

  <circle cx="340" cy="390" r="26" class="done-node" filter="url(#shadow)"/>
  <text x="340" y="395" text-anchor="middle" font-size="15" fill="white" font-weight="700">P2</text>

  <text x="340" y="508" text-anchor="middle" font-size="12" class="done-task">아키텍처 설계</text>
  <text x="340" y="526" text-anchor="middle" font-size="12" class="done-task">데이터 구조·UI 흐름</text>
  <text x="340" y="544" text-anchor="middle" font-size="11" fill="#D1D5DB">W2 – W3</text>
</g>


<!-- ════════════════════════════════════════════════════
     PHASE 3  x=550  완료
════════════════════════════════════════════════════ -->
<g>
  <line x1="550" y1="270" x2="550" y2="362" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.35"/>
  <line x1="550" y1="418" x2="550" y2="490" stroke="#991B1B" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.35"/>

  <rect x="480" y="210" width="140" height="58" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="480" y="210" width="140" height="58" rx="10" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="550" y="233" text-anchor="middle" font-size="11" fill="#FCA5A5" font-weight="600" letter-spacing="1">PHASE 3</text>
  <text x="550" y="256" text-anchor="middle" font-size="14" font-weight="700" class="done-title">기본 구현</text>

  <rect x="516" y="268" width="68" height="20" rx="10" class="badge-done"/>
  <text x="550" y="282" text-anchor="middle" class="badge-done-text">✓ 완료</text>

  <circle cx="550" cy="390" r="26" class="done-node" filter="url(#shadow)"/>
  <text x="550" y="395" text-anchor="middle" font-size="15" fill="white" font-weight="700">P3</text>

  <text x="550" y="508" text-anchor="middle" font-size="12" class="done-task">Ingestion 파이프라인</text>
  <text x="550" y="526" text-anchor="middle" font-size="12" class="done-task">Backend API · 관제 UI</text>
  <text x="550" y="544" text-anchor="middle" font-size="11" fill="#D1D5DB">W3 – W5</text>
</g>


<!-- ════════════════════════════════════════════════════
     PHASE 4  x=760  진행중  ← CURRENT
════════════════════════════════════════════════════ -->
<g>
  <!-- Glow rings -->
  <circle cx="760" cy="390" r="46" fill="none" stroke="#FDBA74" stroke-width="3" opacity="0.5"/>
  <circle cx="760" cy="390" r="36" fill="none" stroke="#FED7AA" stroke-width="2" opacity="0.7"/>

  <line x1="760" y1="265" x2="760" y2="354" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="760" y1="426" x2="760" y2="490" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>

  <!-- "현재" indicator -->
  <text x="760" y="148" text-anchor="middle" font-size="12" fill="#EA580C" font-weight="700" letter-spacing="1">▼  현재 진행 중</text>

  <rect x="685" y="158" width="150" height="62" rx="10" fill="white" filter="url(#shadow)"/>
  <rect x="685" y="158" width="150" height="62" rx="10" fill="#FFF7ED" stroke="#FDBA74" stroke-width="1.5"/>
  <text x="760" y="181" text-anchor="middle" font-size="11" fill="#FB923C" font-weight="600" letter-spacing="1">PHASE 4</text>
  <text x="760" y="204" text-anchor="middle" font-size="15" font-weight="700" class="active-title">기능 고도화</text>

  <rect x="716" y="220" width="88" height="20" rx="10" class="badge-active"/>
  <text x="760" y="234" text-anchor="middle" class="badge-active-text">● 진행중</text>

  <circle cx="760" cy="390" r="30" class="active-node" filter="url(#glow)"/>
  <text x="760" y="395" text-anchor="middle" font-size="15" fill="white" font-weight="700">P4</text>

  <text x="760" y="508" text-anchor="middle" font-size="12" class="active-task">의미 검색 고도화</text>
  <text x="760" y="526" text-anchor="middle" font-size="12" class="active-task">VLM 컨텍스트 연결</text>
  <text x="760" y="544" text-anchor="middle" font-size="12" class="active-task">클립·썸네일 생성</text>
  <text x="760" y="562" text-anchor="middle" font-size="11" fill="#D1D5DB">W5 – W6</text>
</g>


<!-- ════════════════════════════════════════════════════
     PHASE 5  x=970  진행 예정
════════════════════════════════════════════════════ -->
<g>
  <line x1="970" y1="265" x2="970" y2="362" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="970" y1="418" x2="970" y2="490" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>

  <rect x="900" y="205" width="140" height="58" rx="10" fill="white"/>
  <rect x="900" y="205" width="140" height="58" rx="10" fill="#FEFCE8" stroke="#FDE68A" stroke-width="1"/>
  <text x="970" y="228" text-anchor="middle" font-size="11" fill="#FCD34D" font-weight="600" letter-spacing="1">PHASE 5</text>
  <text x="970" y="251" text-anchor="middle" font-size="14" font-weight="600" class="todo-title">통합 테스트</text>

  <rect x="926" y="263" width="88" height="20" rx="10" class="badge-todo" stroke="#FDE68A" stroke-width="1"/>
  <text x="970" y="277" text-anchor="middle" class="badge-todo-text">○ 예정</text>

  <circle cx="970" cy="390" r="26" class="todo-node"/>
  <text x="970" y="395" text-anchor="middle" font-size="15" fill="#B45309" font-weight="600">P5</text>

  <text x="970" y="508" text-anchor="middle" font-size="12" class="todo-task">E2E 파이프라인 검증</text>
  <text x="970" y="526" text-anchor="middle" font-size="12" class="todo-task">알림·검색 통합 테스트</text>
  <text x="970" y="544" text-anchor="middle" font-size="11" fill="#FCD34D">W6 – W8</text>
</g>


<!-- ════════════════════════════════════════════════════
     PHASE 6  x=1180  진행 예정
════════════════════════════════════════════════════ -->
<g>
  <line x1="1180" y1="265" x2="1180" y2="362" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="1180" y1="418" x2="1180" y2="490" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>

  <rect x="1110" y="205" width="140" height="58" rx="10" fill="white"/>
  <rect x="1110" y="205" width="140" height="58" rx="10" fill="#FEFCE8" stroke="#FDE68A" stroke-width="1"/>
  <text x="1180" y="228" text-anchor="middle" font-size="11" fill="#FCD34D" font-weight="600" letter-spacing="1">PHASE 6</text>

  <text x="1180" y="277" text-anchor="middle" class="badge-todo-text">○ 예정</text>

  <circle cx="1180" cy="390" r="26" class="todo-node"/>
  <text x="1180" y="395" text-anchor="middle" font-size="15" fill="#B45309" font-weight="600">P6</text>

  <text x="1180" y="508" text-anchor="middle" font-size="12" class="todo-task">사용자·운영자 매뉴얼</text>
  <text x="1180" y="526" text-anchor="middle" font-size="12" class="todo-task">시연 환경 정리</text>
  <text x="1180" y="544" text-anchor="middle" font-size="11" fill="#FCD34D">W8 – W9</text>
</g>


<!-- ════════════════════════════════════════════════════
     PHASE 7  x=1390  진행 예정
════════════════════════════════════════════════════ -->
<g>
  <line x1="1390" y1="265" x2="1390" y2="362" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <line x1="1390" y1="418" x2="1390" y2="490" stroke="#FCD34D" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>

<!-- ─── Legend (bottom right) ─── -->
<g transform="translate(1230, 640)">
  <rect x="-10" y="-16" width="340" height="96" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>

  <!-- 완료 -->

<!-- ─── Progress summary (bottom left) ─── -->
<g transform="translate(48, 640)">
  <rect x="-10" y="-16" width="240" height="62" rx="10" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1"/>

</svg>
</body>
